<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente SAP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sap-blue: #0070f3;
      --sap-dark: #003366;
      --sap-light: #e8f0fe;
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e6ea;
      --text: #1a1a2e;
      --muted: #6b7a8d;
      --radius: 12px;
      --font: 'IBM Plex Sans', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--sap-dark);
      color: white;
      padding: 0 1.5rem;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header .logo {
      background: var(--sap-blue);
      color: white;
      font-weight: 600;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    header h1 {
      font-size: 15px;
      font-weight: 500;
      opacity: 0.9;
    }

    header .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      opacity: 0.75;
    }

    header .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    .welcome {
      text-align: center;
      padding: 2rem 1rem;
      max-width: 480px;
      margin: auto;
    }

    .welcome .icon {
      font-size: 40px;
      margin-bottom: 1rem;
    }

    .welcome h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--sap-dark);
      margin-bottom: 8px;
    }

    .welcome p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }

    .suggestions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .suggestion-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: var(--font);
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .suggestion-btn:hover {
      border-color: var(--sap-blue);
      background: var(--sap-light);
      color: var(--sap-dark);
    }

    .suggestion-btn span {
      color: var(--sap-blue);
      font-size: 16px;
    }

    .msg {
      display: flex;
      gap: 10px;
      max-width: 780px;
      width: 100%;
    }

    .msg.user { margin-left: auto; flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }

    .msg.user .avatar { background: var(--sap-blue); color: white; font-size: 12px; }
    .msg.assistant .avatar { background: var(--sap-dark); color: white; font-size: 11px; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      max-width: calc(100% - 42px);
    }

    .msg.user .bubble {
      background: var(--sap-dark);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .bubble ol, .bubble ul {
      padding-left: 1.4rem;
      margin: 8px 0;
    }

    .bubble li { margin-bottom: 4px; }

    .bubble strong {
      color: var(--sap-dark);
      font-weight: 600;
    }

    .bubble .warning {
      background: #fff8e1;
      border-left: 3px solid #f59e0b;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin: 8px 0;
      font-size: 13px;
      color: #92400e;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      max-width: 780px;
      margin: 0 auto;
    }

    textarea {
      flex: 1;
      font-family: var(--font);
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      resize: none;
      outline: none;
      line-height: 1.5;
      height: 44px;
      max-height: 120px;
      transition: border-color 0.15s;
      color: var(--text);
      background: var(--bg);
    }

    textarea:focus { border-color: var(--sap-blue); background: white; }
    textarea::placeholder { color: var(--muted); }

    button#send-btn {
      background: var(--sap-blue);
      color: white;
      border: none;
      border-radius: var(--radius);
      width: 44px;
      height: 44px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    button#send-btn:hover { background: var(--sap-dark); }
    button#send-btn:disabled { background: var(--border); cursor: default; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SAP</div>
  <h1>Assistente Formazione</h1>
  <div class="status">
    <div class="dot"></div>
    Online
  </div>
</header>

<div id="chat-container">
  <div class="welcome" id="welcome">
    <div class="icon">📘</div>
    <h2>Benvenuto nell'Assistente SAP</h2>
    <p>Sono qui per aiutarti durante la formazione. Fai una domanda su qualsiasi procedura SAP e ti risponderò passo per passo basandomi sul manuale del tuo negozio.</p>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this.dataset.q)" data-q="Come si crea un ordine di acquisto?">
        <span>→</span> Come si crea un ordine di acquisto?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.dataset.q)" data-q="Come si registra un pagamento fornitore?">
        <span>→</span> Come si registra un pagamento fornitore?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.dataset.q)" data-q="Come si gestisce il magazzino?">
        <span>→</span> Come si gestisce il magazzino?
      </button>
      <button class="suggestion-btn" onclick="sendSuggestion(this.dataset.q)" data-q="Quali sono le operazioni principali che posso fare in SAP?">
        <span>→</span> Quali operazioni principali posso fare?
      </button>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Chiedi una procedura SAP..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()" aria-label="Invia">➤</button>
  </div>
  <p class="hint">Basato sul manuale SAP del tuo negozio · Premi Invio per inviare</p>
</footer>

<script>
  const chatEl = document.getElementById('chat-container');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  let history = [];

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  function sendSuggestion(text) {
    inputEl.value = text;
    sendMessage();
  }

  function addMessage(role, text) {
    document.getElementById('welcome')?.remove();
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'TU' : 'SAP';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return bubble;
  }

  function formatText(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^(\d+\.\s)/gm, '<br>$1')
      .replace(/^[-•]\s(.+)/gm, '<br>• $1')
      .replace(/⚠️(.+)/g, '<div class="warning">⚠️$1</div>')
      .replace(/\n/g, '<br>');
  }

  function showTyping() {
    document.getElementById('welcome')?.remove();
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.id = 'typing-indicator';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'SAP';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    inputEl.style.height = '44px';
    sendBtn.disabled = true;

    addMessage('user', text);
    history.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history })
      });

      document.getElementById('typing-indicator')?.remove();

      if (!res.ok) throw new Error('Errore server');
      const data = await res.json();
      addMessage('assistant', data.reply);
      history.push({ role: 'assistant', content: data.reply });
    } catch (err) {
      document.getElementById('typing-indicator')?.remove();
      addMessage('assistant', '⚠️ Si è verificato un errore. Riprova tra qualche istante.');
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
